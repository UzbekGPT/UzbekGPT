<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UzbekGPT</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: white;
    color: #222;
}

/* SIDEBAR */
.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 260px;
    background: #f7f7f8;
    padding: 15px;
    border-right: 1px solid #ddd;
    overflow-y: auto;
}

.logo {
    font-size: 21px;
    font-weight: bold;
    padding: 12px;
    margin-bottom: 10px;
}

.new-chat {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 9px;
    background: white;
    cursor: pointer;
    text-align: left;
    font-size: 15px;
}

.new-chat:hover {
    background: #eee;
}

.history-title {
    margin: 25px 10px 10px;
    font-size: 13px;
    color: #777;
}

.chat-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px;
    margin: 3px 0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}

.chat-item:hover {
    background: #e9e9e9;
}

.chat-item.active {
    background: #ddd;
}

.chat-name {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    max-width: 180px;
}

.delete-chat {
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 14px;
}

/* MAIN */
.main {
    margin-left: 260px;
    min-height: 100vh;
    padding-bottom: 120px;
}

.top {
    height: 60px;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    padding: 0 25px;
    font-weight: bold;
}

#chat {
    max-width: 850px;
    margin: auto;
    padding: 30px 20px;
}

.welcome {
    text-align: center;
    margin-top: 120px;
}

.welcome h1 {
    font-size: 32px;
}

.welcome p {
    color: #777;
}

/* MESSAGES */
.message {
    display: flex;
    margin: 22px 0;
}

.message div {
    max-width: 80%;
    padding: 13px 17px;
    border-radius: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
}

.user {
    justify-content: flex-end;
}

.user div {
    background: #f0f0f0;
}

.bot {
    justify-content: flex-start;
}

.bot div {
    background: white;
}

/* INPUT */
#inputArea {
    position: fixed;
    bottom: 0;
    left: 260px;
    right: 0;
    padding: 20px;
    background: linear-gradient(transparent, white 30%);
}

.input-box {
    max-width: 800px;
    margin: auto;
    display: flex;
    gap: 8px;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 15px;
    background: white;
    box-shadow: 0 2px 10px #ddd;
}

#question {
    flex: 1;
    border: none;
    outline: none;
    padding: 12px;
    font-size: 16px;
}

#sendBtn {
    width: 45px;
    height: 45px;
    border: none;
    border-radius: 10px;
    background: #222;
    color: white;
    cursor: pointer;
    font-size: 20px;
}

#sendBtn:hover {
    background: #000;
}

/* MOBILE */
@media(max-width:700px) {

    .sidebar {
        display: none;
    }

    .main {
        margin-left: 0;
    }

    #inputArea {
        left: 0;
    }

    .message div {
        max-width: 90%;
    }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar">

    <div class="logo">
        UzbekGPT 🤖
    </div>

    <button class="new-chat" onclick="newChat()">
        ＋ Yangi chat
    </button>

    <div class="history-title">
        Eski chatlar
    </div>

    <div id="history"></div>

</aside>


<!-- MAIN -->
<main class="main">

    <div class="top">
        UzbekGPT
    </div>

    <div id="chat">

        <div class="welcome">
            <h1>UzbekGPT</h1>
            <p>Sizga qanday yordam bera olaman?</p>
        </div>

    </div>

</main>


<!-- INPUT -->
<div id="inputArea">

    <div class="input-box">

        <input
            id="question"
            type="text"
            placeholder="Xabar yuboring..."
            autocomplete="off"
        >

        <button id="sendBtn" onclick="sendMessage()">
            ↑
        </button>

    </div>

</div>


<script>

const questionInput =
    document.getElementById("question");

const chat =
    document.getElementById("chat");

const history =
    document.getElementById("history");


let chats =
    JSON.parse(localStorage.getItem("uzbekgpt_chats") || "[]");

let currentChat = null;


/* YANGI CHAT */
function newChat() {

    currentChat = {
        id: Date.now(),
        title: "Yangi chat",
        messages: []
    };

    chats.unshift(currentChat);

    saveChats();

    showChat();

    renderHistory();

    questionInput.focus();
}


/* SAQLASH */
function saveChats() {

    localStorage.setItem(
        "uzbekgpt_chats",
        JSON.stringify(chats)
    );
}


/* CHATNI KO'RSATISH */
function showChat() {

    chat.innerHTML = "";

    if (!currentChat || currentChat.messages.length === 0) {

        chat.innerHTML = `
            <div class="welcome">
                <h1>UzbekGPT</h1>
                <p>Sizga qanday yordam bera olaman?</p>
            </div>
        `;

        return;
    }


    currentChat.messages.forEach(message => {

        addMessageToScreen(
            message.text,
            message.type
        );

    });
}


/* XABARNI EKRANGA CHIQARISH */
function addMessageToScreen(text, type) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    const content =
        document.createElement("div");

    content.textContent = text;

    message.appendChild(content);

    chat.appendChild(message);
}


/* XABAR YUBORISH */
async function sendMessage() {

    const question =
        questionInput.value.trim();

    if (!question) return;


    /* Agar chat yo'q bo'lsa */
    if (!currentChat) {
        newChat();
    }


    /* USER */
    currentChat.messages.push({
        text: question,
        type: "user"
    });


    if (currentChat.title === "Yangi chat") {

        currentChat.title =
            question.substring(0, 30);

    }


    questionInput.value = "";

    showChat();

    renderHistory();

    saveChats();


    /* LOADING */
    addMessageToScreen(
        "⏳ Javob tayyorlanmoqda...",
        "bot"
    );


    const loadingMessage =
        chat.lastElementChild;


    try {

        const response =
            await fetch("/api/chat", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    question: question
                })

            });


        const data =
            await response.json();


        loadingMessage.remove();


        if (data.answer) {

            currentChat.messages.push({
                text: data.answer,
                type: "bot"
            });

            saveChats();

            showChat();

        } else {

            addMessageToScreen(
                "Xatolik yuz berdi.",
                "bot"
            );

        }


    } catch (error) {

        loadingMessage.remove();

        addMessageToScreen(
            "Server bilan bog‘lanib bo‘lmadi.",
            "bot"
        );

    }

}


/* ESKI CHATLAR */
function renderHistory() {

    history.innerHTML = "";


    chats.forEach(item => {

        const row =
            document.createElement("div");

        row.className = "chat-item";


        if (
            currentChat &&
            currentChat.id === item.id
        ) {
            row.classList.add("active");
        }


        const name =
            document.createElement("span");

        name.className = "chat-name";

        name.textContent =
            "💬 " + item.title;


        const deleteButton =
            document.createElement("button");

        deleteButton.className =
            "delete-chat";

        deleteButton.textContent =
            "🗑️";


        deleteButton.onclick =
            function(event) {

                event.stopPropagation();

                deleteChat(item.id);

            };


        row.onclick =
            function() {

                openChat(item.id);

            };


        row.appendChild(name);

        row.appendChild(deleteButton);

        history.appendChild(row);

    });

}


/* CHATNI OCHISH */
function openChat(id) {

    currentChat =
        chats.find(item => item.id === id);

    showChat();

    renderHistory();

}


/* CHATNI O'CHIRISH */
function deleteChat(id) {

    chats =
        chats.filter(item => item.id !== id);


    if (
        currentChat &&
        currentChat.id === id
    ) {

        currentChat = null;

        showChat();

    }


    saveChats();

    renderHistory();

}


/* ENTER */
questionInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    }
);


/* BOSHLANG'ICH */
renderHistory();

if (chats.length > 0) {

    currentChat = chats[0];

    showChat();

}

</script>

</body>
</html>
