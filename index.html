
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UzbekGPT PRO</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
    background: #fff;
    color: #222;
}

body.dark {
    background: #212121;
    color: #fff;
}

.sidebar {
    width: 250px;
    background: #f5f5f5;
    padding: 15px;
    border-right: 1px solid #ddd;
}

.dark .sidebar {
    background: #171717;
    border-color: #444;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 25px;
}

button {
    cursor: pointer;
    border: none;
}

.side-button {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    border: 1px solid #bbb;
    border-radius: 10px;
    background: transparent;
    font-size: 14px;
}

.side-button:hover {
    background: #ddd;
}

.dark .side-button {
    color: white;
    border-color: #555;
}

.dark .side-button:hover {
    background: #333;
}

.history-title {
    margin-top: 25px;
    font-weight: bold;
}

#history {
    margin-top: 12px;
    overflow-y: auto;
    max-height: 60vh;
}

.history-item {
    padding: 9px;
    margin-bottom: 5px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    overflow-wrap: anywhere;
}

.history-item:hover {
    background: #ddd;
}

.dark .history-item:hover {
    background: #333;
}

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.header {
    padding: 20px;
    font-size: 21px;
    font-weight: bold;
    border-bottom: 1px solid #ddd;
}

.dark .header {
    border-color: #444;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 30px 20px;
}

.message {
    width: 100%;
    max-width: 900px;
    margin: 0 auto 25px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
}

.message.user {
    justify-content: flex-end;
}

.message.assistant {
    justify-content: flex-start;
}

.avatar {
    width: 38px;
    height: 38px;
    min-width: 38px;
    border-radius: 50%;
    background: #10a37f;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
}

.message.user .avatar {
    order: 2;
    background: #2563eb;
}

.message-content {
    max-width: 75%;
    padding: 13px 17px;
    border-radius: 18px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.message.user .message-content {
    order: 1;
    background: #dbeafe;
    color: #111827;
    border-bottom-right-radius: 4px;
}

.message.assistant .message-content {
    background: #eee;
    color: #111827;
    border-bottom-left-radius: 4px;
}

.dark .message.user .message-content {
    background: #1d4ed8;
    color: white;
}

.dark .message.assistant .message-content {
    background: #303030;
    color: white;
}

.message-content img {
    display: block;
    max-width: 100%;
    margin-top: 10px;
    border-radius: 12px;
}

.input-area {
    padding: 15px 20px 20px;
    border-top: 1px solid #ddd;
}

.dark .input-area {
    border-color: #444;
}

.input-box {
    max-width: 900px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px;
    border: 1px solid #aaa;
    border-radius: 16px;
    background: white;
}

.dark .input-box {
    background: #2f2f2f;
    border-color: #555;
}

#prompt {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    resize: none;
    padding: 10px;
    font-size: 16px;
    background: transparent;
    color: inherit;
}

.tool-button,
.send-button {
    padding: 11px 13px;
    border-radius: 10px;
    font-size: 17px;
}

.tool-button {
    background: #e5e7eb;
}

.send-button {
    background: #10a37f;
    color: white;
}

.tool-button:hover,
.send-button:hover {
    opacity: .75;
}

.status {
    text-align: center;
    color: #888;
    font-size: 12px;
    margin-top: 8px;
}

@media (max-width: 700px) {
    .sidebar {
        display: none;
    }

    .message-content {
        max-width: 85%;
    }

    .chat {
        padding: 20px 10px;
    }

    .input-area {
        padding: 10px;
    }
}
</style>
</head>

<body>

<aside class="sidebar">
    <div class="logo">UzbekGPT PRO</div>

    <button type="button" class="side-button" id="newChatButton">
        ➕ Yangi chat
    </button>

    <button type="button" class="side-button" id="darkButton">
        🌙 Dark mode
    </button>

    <div class="history-title">Chat tarixi</div>
    <div id="history"></div>
</aside>

<main class="main">

    <header class="header">
        UzbekGPT
    </header>

    <section class="chat" id="chat">
        <div class="message assistant">
            <div class="avatar">U</div>
            <div class="message-content">
                Salom! Men UzbekGPT. Sizga qanday yordam beray? 🤖
            </div>
        </div>
    </section>

    <section class="input-area">
        <div class="input-box">

            <button type="button" class="tool-button" id="voiceButton">
                🎤
            </button>

            <button type="button" class="tool-button" id="imageButton">
                🖼️
            </button>

            <textarea id="prompt" rows="1" placeholder="Xabar yozing..."></textarea>

            <button type="button" class="send-button" id="sendButton">
                ➤
            </button>

        </div>

        <div class="status" id="status">
            Tayyor
        </div>
    </section>

</main>

<script>
const chat = document.getElementById("chat");
const promptInput = document.getElementById("prompt");
const statusText = document.getElementById("status");
const historyBox = document.getElementById("history");

const newChatButton = document.getElementById("newChatButton");
const darkButton = document.getElementById("darkButton");
const voiceButton = document.getElementById("voiceButton");
const imageButton = document.getElementById("imageButton");
const sendButton = document.getElementById("sendButton");

let imageModeEnabled = false;

/* XABAR QO‘SHISH */
function addMessage(role, text, imageUrl = null) {
    const message = document.createElement("div");
    message.className = "message " + role;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "S" : "U";

    const content = document.createElement("div");
    content.className = "message-content";
    content.textContent = text || "";

    if (imageUrl) {
        const image = document.createElement("img");
        image.src = imageUrl;
        image.alt = "Yaratilgan rasm";
        content.appendChild(image);
    }

    message.appendChild(avatar);
    message.appendChild(content);
    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
}

/* YANGI CHAT */
newChatButton.addEventListener("click", function() {
    chat.innerHTML = `
        <div class="message assistant">
            <div class="avatar">U</div>
            <div class="message-content">
                Yangi chat boshlandi. Qanday yordam beray? 🤖
            </div>
        </div>
    `;

    promptInput.value = "";
    statusText.textContent = "Yangi chat tayyor";
});

/* DARK MODE */
darkButton.addEventListener("click", function() {
    document.body.classList.toggle("dark");

    const enabled = document.body.classList.contains("dark");
    localStorage.setItem("darkMode", enabled);

    darkButton.textContent = enabled
        ? "☀️ Light mode"
        : "🌙 Dark mode";
});

if (localStorage.getItem("darkMode") === "true") {
    document.body.classList.add("dark");
    darkButton.textContent = "☀️ Light mode";
}

/* RASM REJIMI */
imageButton.addEventListener("click", function() {
    imageModeEnabled = !imageModeEnabled;

    if (imageModeEnabled) {
        promptInput.placeholder = "Qanday rasm yaratamiz?";
        statusText.textContent = "Rasm rejimi yoqildi 🖼️";
        imageButton.style.background = "#10a37f";
        imageButton.style.color = "white";
    } else {
        promptInput.placeholder = "Xabar yozing...";
        statusText.textContent = "Oddiy chat rejimi";
        imageButton.style.background = "";
        imageButton.style.color = "";
    }

    promptInput.focus();
});

/* XABAR YUBORISH */
sendButton.addEventListener("click", sendMessage);

promptInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
});

async function sendMessage() {
    const text = promptInput.value.trim();

    if (!text) {
        statusText.textContent = "Avval xabar yozing";
        return;
    }

    addMessage("user", text);
    promptInput.value = "";
    sendButton.disabled = true;
    statusText.textContent = "Javob tayyorlanmoqda...";

    try {
        const endpoint = imageModeEnabled
            ? "/api/image"
            : "/api/chat";

        const body = imageModeEnabled
            ? { prompt: text }
            : { message: text };

        const response = await fetch(endpoint, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(body)
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || data.message || "Server xatosi");
        }

        if (imageModeEnabled && data.image) {
            addMessage("assistant", "Mana siz so‘ragan rasm:", data.image);
        } else {
            const reply = data.reply || data.message || data.text;

            if (reply) {
                addMessage("assistant", reply);
            } else {
                addMessage("assistant", "Server bo‘sh javob qaytardi.");
            }
        }

        saveHistory(text);

    } catch (error) {
        console.error(error);

        addMessage(
            "assistant",
            "Xatolik: " + error.message
        );

        statusText.textContent = "Xatolik yuz berdi";
    }

    imageModeEnabled = false;
    imageButton.style.background = "";
    imageButton.style.color = "";
    promptInput.placeholder = "Xabar yozing...";
    sendButton.disabled = false;
    statusText.textContent = "Tayyor";
}

/* CHAT TARIXI */
function saveHistory(text) {
    const history = JSON.parse(
        localStorage.getItem("chatHistory") || "[]"
    );

    history.push(text);

    localStorage.setItem(
        "chatHistory",
        JSON.stringify(history.slice(-20))
    );

    showHistory();
}

function showHistory() {
    historyBox.innerHTML = "";

    const history = JSON.parse(
        localStorage.getItem("chatHistory") || "[]"
    );

    history.forEach(function(text) {
        const item = document.createElement("div");
        item.className = "history-item";
        item.textContent = "💬 " + text;

        item.addEventListener("click", function() {
            promptInput.value = text;
            promptInput.focus();
        });

        historyBox.appendChild(item);
    });
}

showHistory();

/* MIKROFON */
voiceButton.addEventListener("click", function() {
    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Sizning brauzeringiz mikrofonni qo‘llab-quvvatlamaydi.");
        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "uz-UZ";
    recognition.continuous = false;
    recognition.interimResults = false;

    statusText.textContent = "Tinglayapman... 🎤";

    recognition.start();

    recognition.onresult = function(event) {
        promptInput.value =
            event.results[0][0].transcript;

        statusText.textContent = "Ovoz qabul qilindi";
    };

    recognition.onerror = function(event) {
        statusText.textContent =
            "Mikrofon xatosi: " + event.error;
    };

    recognition.onend = function() {
        if (statusText.textContent === "Tinglayapman... 🎤") {
            statusText.textContent = "Tayyor";
        }
    };
});
</script>

</body>
</html>
