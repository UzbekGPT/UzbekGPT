
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UzbekGPT</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #212121;
    color: #fff;
    display: flex;
    height: 100vh;
}

/* SIDEBAR */
.sidebar {
    width: 260px;
    background: #171717;
    padding: 15px;
    display: flex;
    flex-direction: column;
}

.logo {
    font-size: 20px;
    font-weight: bold;
    padding: 15px 10px 25px;
}

.new-chat {
    background: #2f2f2f;
    color: white;
    border: 1px solid #555;
    padding: 13px;
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
    font-size: 14px;
}

.new-chat:hover {
    background: #444;
}

.sidebar-bottom {
    margin-top: auto;
    color: #aaa;
    font-size: 13px;
    padding: 10px;
}

/* MAIN */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.topbar {
    height: 60px;
    border-bottom: 1px solid #3b3b3b;
    display: flex;
    align-items: center;
    padding: 0 25px;
    font-size: 18px;
    font-weight: bold;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 35px 20px 140px;
}

.welcome {
    text-align: center;
    margin-top: 15vh;
}

.welcome h1 {
    font-size: 30px;
}

.welcome p {
    color: #aaa;
}

/* MESSAGES */
.message {
    max-width: 850px;
    margin: 25px auto;
    display: flex;
    gap: 15px;
    line-height: 1.6;
}

.avatar {
    width: 35px;
    height: 35px;
    border-radius: 8px;
    background: #10a37f;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.content {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user .content {
    background: #2f2f2f;
    padding: 12px 16px;
    border-radius: 15px;
}

/* INPUT */
.input-area {
    position: fixed;
    bottom: 0;
    left: 260px;
    right: 0;
    padding: 20px;
    background: linear-gradient(transparent, #212121 25%);
}

.input-box {
    max-width: 850px;
    margin: auto;
    display: flex;
    gap: 10px;
    background: #2f2f2f;
    border: 1px solid #555;
    border-radius: 15px;
    padding: 10px;
}

input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 16px;
    padding: 8px;
    min-width: 0;
}

input::placeholder {
    color: #aaa;
}

.send {
    background: #10a37f;
    border: none;
    color: white;
    border-radius: 10px;
    padding: 10px 15px;
    cursor: pointer;
    font-size: 16px;
}

.send:hover {
    background: #0d8c6d;
}

/* MOBILE */
@media (max-width: 700px) {
    .sidebar {
        display: none;
    }

    .input-area {
        left: 0;
    }

    .topbar {
        justify-content: center;
    }

    .message {
        margin: 20px 5px;
    }
}
</style>
</head>

<body>

<aside class="sidebar">
    <div class="logo">🇺🇿 UzbekGPT</div>

    <button class="new-chat" onclick="clearChat()">
        ＋ Yangi chat
    </button>

    <div class="sidebar-bottom">
        UzbekGPT AI
    </div>
</aside>

<main class="main">

    <header class="topbar">
        UzbekGPT
    </header>

    <section class="chat" id="chat">

        <div class="welcome" id="welcome">
            <h1>Qanday yordam bera olaman?</h1>
            <p>UzbekGPT bilan suhbatni boshlang.</p>
        </div>

    </section>

    <div class="input-area">
        <div class="input-box">

            <input
                id="question"
                type="text"
                placeholder="Xabar yuborish..."
                autocomplete="off"
            >

            <button class="send" onclick="sendMessage()">
                ↑
            </button>

        </div>
    </div>

</main>

<script>
const chat = document.getElementById("chat");
const questionInput = document.getElementById("question");

const SERVER_URL = "https://uzbekgpt-agb1.onrender.com";

function addMessage(text, type) {

    const welcome = document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    const message = document.createElement("div");
    message.className = "message " + type;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = type === "user" ? "S" : "🤖";

    const content = document.createElement("div");
    content.className = "content";
    content.textContent = text;

    message.appendChild(avatar);
    message.appendChild(content);

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

    return message;
}

async function sendMessage() {

    const question = questionInput.value.trim();

    if (!question) return;

    addMessage(question, "user");

    questionInput.value = "";

    const loading = addMessage("⏳ Javob tayyorlanmoqda...", "bot");

    try {

        const response = await fetch(
            SERVER_URL + "/api/chat",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    question: question
                })
            }
        );

        const data = await response.json();

        loading.remove();

        if (data.answer) {
            addMessage(data.answer, "bot");
        } else {
            addMessage(
                "AI javob qaytarmadi.",
                "bot"
            );
        }

    } catch (error) {

        loading.remove();

        addMessage(
            "Server bilan bog‘lanib bo‘lmadi.",
            "bot"
        );

        console.error(error);
    }
}

questionInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

function clearChat() {

    chat.innerHTML = `
        <div class="welcome" id="welcome">
            <h1>Qanday yordam bera olaman?</h1>
            <p>UzbekGPT bilan suhbatni boshlang.</p>
        </div>
    `;

}
</script>

</body>
</html>
